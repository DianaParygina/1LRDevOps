<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Мир животных</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/react@18.2.0/umd/react.production.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/react-dom@18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@babel/standalone@7.22.5/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
    <nav class="navbar navbar-expand-lg bg-body-tertiary">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">Мир животных</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarSupportedContent">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item">
                        <a class="nav-link active" aria-current="page" href="#">Главная</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">О нас</a>
                    </li>
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                            Категории
                        </a>
                        <ul class="dropdown-menu">
                            <li><a class="dropdown-item" href="#">Млекопитающие</a></li>
                            <li><a class="dropdown-item" href="#">Птицы</a></li>
                            <li><hr class="dropdown-divider"></li>
                            <li><a class="dropdown-item" href="#">Все животные</a></li>
                        </ul>
                    </li>
                </ul>
                <div class="d-flex" role="search">
                    <input class="form-control me-2" type="search" placeholder="Поиск животных" aria-label="Search"/>
                    <button class="btn btn-outline-success" type="button">Поиск</button>
                </div>
            </div>
        </div>
    </nav>

    <div id="root" class="container mx-auto p-4"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script type="text/babel">
        const { useState } = React;

        const App = () => {
            const [animals, setAnimals] = useState([
                { id: 1, name: "Лев", description: "Царь зверей, обитает в саваннах.", image: "https://via.placeholder.com/150" },
                { id: 2, name: "Слон", description: "Крупнейшее сухопутное животное.", image: "https://via.placeholder.com/150" }
            ]);
            const [newAnimal, setNewAnimal] = useState({ name: "", description: "", image: "" });
            const [editingAnimal, setEditingAnimal] = useState(null);

            const addAnimal = () => {
                if (newAnimal.name && newAnimal.description) {
                    setAnimals([...animals, { id: Date.now(), ...newAnimal }]);
                    setNewAnimal({ name: "", description: "", image: "" });
                }
            };

            const deleteAnimal = (id) => {
                setAnimals(animals.filter(animal => animal.id !== id));
            };

            const startEditing = (animal) => {
                setEditingAnimal({ ...animal });
            };

            const saveEdit = () => {
                if (editingAnimal.name && editingAnimal.description) {
                    setAnimals(animals.map(animal => animal.id === editingAnimal.id ? editingAnimal : animal));
                    setEditingAnimal(null);
                }
            };

            return (
                <div className="space-y-6">
                    <h1 className="text-3xl font-bold text-center">Мир животных</h1>
                    
                    {/* Форма для добавления животного */}
                    <div className="bg-white p-6 rounded-lg shadow-md">
                        <h2 className="text-xl font-semibold mb-4">Добавить новое животное</h2>
                        <input
                            type="text"
                            placeholder="Название животного"
                            value={newAnimal.name}
                            onChange={(e) => setNewAnimal({ ...newAnimal, name: e.target.value })}
                            className="w-full p-2 mb-2 border rounded"
                        />
                        <textarea
                            placeholder="Описание животного"
                            value={newAnimal.description}
                            onChange={(e) => setNewAnimal({ ...newAnimal, description: e.target.value })}
                            className="w-full p-2 mb-2 border rounded"
                        />
                        <input
                            type="text"
                            placeholder="URL изображения"
                            value={newAnimal.image}
                            onChange={(e) => setNewAnimal({ ...newAnimal, image: e.target.value })}
                            className="w-full p-2 mb-2 border rounded"
                        />
                        <button
                            onClick={addAnimal}
                            className="bg-blue-500 text-white px-4 py-2 rounded hover:bg-blue-600"
                        >
                            Добавить
                        </button>
                    </div>

                    {/* Форма редактирования */}
                    {editingAnimal && (
                        <div className="bg-white p-6 rounded-lg shadow-md">
                            <h2 className="text-xl font-semibold mb-4">Редактировать животное</h2>
                            <input
                                type="text"
                                value={editingAnimal.name}
                                onChange={(e) => setEditingAnimal({ ...editingAnimal, name: e.target.value })}
                                className="w-full p-2 mb-2 border rounded"
                            />
                            <textarea
                                value={editingAnimal.description}
                                onChange={(e) => setEditingAnimal({ ...editingAnimal, description: e.target.value })}
                                className="w-full p-2 mb-2 border rounded"
                            />
                            <input
                                type="text"
                                value={editingAnimal.image}
                                onChange={(e) => setEditingAnimal({ ...editingAnimal, image: e.target.value })}
                                className="w-full p-2 mb-2 border rounded"
                            />
                            <div className="space-x-2">
                                <button
                                    onClick={saveEdit}
                                    className="bg-green-500 text-white px-4 py-2 rounded hover:bg-green-600"
                                >
                                    Сохранить
                                </button>
                                <button
                                    onClick={() => setEditingAnimal(null)}
                                    className="bg-gray-500 text-white px-4 py-2 rounded hover:bg-gray-600"
                                >
                                    Отмена
                                </button>
                            </div>
                        </div>
                    )}

                    {/* Список животных */}
                    <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                        {animals.map(animal => (
                            <div key={animal.id} className="bg-white p-4 rounded-lg shadow-md">
                                <img src={animal.image} alt={animal.name} className="w-full h-40 object-cover rounded mb-2" />
                                <h3 className="text-lg font-semibold">{animal.name}</h3>
                                <p className="text-gray-600">{animal.description}</p>
                                <div className="mt-4 space-x-2">
                                    <button
                                        onClick={() => startEditing(animal)}
                                        className="bg-yellow-500 text-white px-3 py-1 rounded hover:bg-yellow-600"
                                    >
                                        Редактировать
                                    </button>
                                    <button
                                        onClick={() => deleteAnimal(animal.id)}
                                        className="bg-red-500 text-white px-3 py-1 rounded hover:bg-red-600"
                                    >
                                        Удалить
                                    </button>
                                </div>
                            </div>
                        ))}
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
